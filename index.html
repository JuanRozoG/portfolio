<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!--core:head-->
  <link rel="stylesheet" href="/style.css?v=17" />
</head>
<body class="page-intro">

  <!-- Header, menu overlay and cursor are built by /assets/core.js -->
  <main id="main">

  <!-- ══════════════════════════════════════════════════════════
       INTRO PAGE
       ══════════════════════════════════════════════════════════ -->
  <section class="page page-section active" id="page-intro">
    <div class="intro-collage" id="intro-collage"></div>
    <div class="intro-center">
      <h1 class="intro-name" id="intro-name"></h1>
      <p class="intro-tagline" id="intro-tagline"></p>
      <a class="intro-cta" id="intro-cta" href="/info"></a>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════════
       PEOPLE PAGE
       ══════════════════════════════════════════════════════════ -->
  <section class="page page-section page-carousel-section" id="page-people" hidden>
    <h1 class="visually-hidden page-heading">People</h1>
    <div class="carousel-container" id="carousel-people" tabindex="-1">
      <div class="carousel-track" id="carousel-track"></div>
    </div>
    <p class="gallery-counter carousel-counter" aria-live="polite"></p>
    <a class="gallery-end-cta" href="/info" hidden></a>
  </section>

  <!-- ══════════════════════════════════════════════════════════
       THINGS PAGE
       ══════════════════════════════════════════════════════════ -->
  <section class="page page-section page-grid-section" id="page-things" hidden>
    <h1 class="visually-hidden page-heading">Things</h1>
    <div class="portfolio-grid" id="grid-things"></div>
  </section>

  <!-- ══════════════════════════════════════════════════════════
       PERSONAL V2 — CAROUSEL
       ══════════════════════════════════════════════════════════ -->
  <section class="page page-section page-personal-v2-section" id="page-personal-v2" hidden>
    <h1 class="visually-hidden page-heading">Personal</h1>
    <div class="personal-v2-carousel" id="personal-v2-carousel"></div>
    <p class="personal-v2-counter gallery-counter" id="personal-v2-counter" aria-live="polite"></p>
    <a class="gallery-end-cta" href="/info" hidden></a>
  </section>

  <!-- ══════════════════════════════════════════════════════════
       INFO PAGE
       ══════════════════════════════════════════════════════════ -->
  <section class="page page-section" id="page-info" hidden></section>

  <!-- ══════════════════════════════════════════════════════════
       ARCHIVE — Hidden parallax gallery  (access via #archive)
       ══════════════════════════════════════════════════════════ -->
  <section class="page page-section page-archive-section" id="page-archive" hidden>
    <h1 class="visually-hidden page-heading">Archive</h1>
    <div class="archive-grid" id="archive-grid"></div>
  </section>
  </main>


  <!-- GSAP core — required for RIT transitions -->
  <script src="/js/elastic-grid/gsap.min.js"></script>
  <script src="/assets/collage.js"></script>
  <script src="/assets/viewer.js"></script>

  <script src="/config.js"></script>
  <script>
  (() => {
    'use strict';

    /* ════════════════════════════════════════════════════════
       SETUP — populate from config
       ════════════════════════════════════════════════════════ */

    // Visually-hidden H1 of each gallery view = its menu label from the CMS
    pagesHeadings();
    function pagesHeadings() {
      (CONFIG.menuPages || []).forEach(p => {
        const h = document.querySelector(`#page-${p.id} .page-heading`);
        if (h && p.menuLabel) h.textContent = p.menuLabel;
      });
    }

    // Intro
    const _introC = CONFIG.pageContent?.intro || {};
    document.getElementById('intro-name').textContent = CONFIG.name;
    const introCta = document.getElementById('intro-cta');
    introCta.textContent = (_introC.footerCta2 || "Let's work together.").replace(/\.$/, '') + ' →';
    introCta.href = pageUrlFor('info');
    document.getElementById('intro-tagline').textContent =
      _introC.tagline || `Melbourne based. ${CONFIG.tagline}. EST 2020`;

    // Intro collage — shared engine in /assets/collage.js. Photos never cover
    // the header or the name/tagline block; reveal waits for decoded images.
    const collageContainer = document.getElementById('intro-collage');
    const introPool = CONFIG.pageGalleries?.intro || [];
    const introCenter = document.querySelector('#page-intro .intro-center');
    let collageItems = null;

    function collageExclusions() {
      const pad = 16;
      const header = document.querySelector('.site-header');
      const c = introCenter.getBoundingClientRect();
      const rects = [new DOMRect(c.left - pad, c.top - pad, c.width + pad * 2, c.height + pad * 2)];
      if (header) rects.push(new DOMRect(0, 0, innerWidth, header.getBoundingClientRect().bottom));
      return rects;
    }

    function mountCollage() {
      if (!document.getElementById('page-intro').classList.contains('active')) return null;
      // The header (an exclusion zone) is built by core.js on DOMContentLoaded
      if (document.readyState === 'loading') {
        return new Promise(res => document.addEventListener('DOMContentLoaded', () => res(mountCollage()), { once: true }));
      }
      collageItems = collageItems || Collage.pickBalanced(introPool, 9);
      return Collage.mount(collageContainer, collageItems, {
        exclude: collageExclusions,
        reveal: 'spread',
        onClick: (item, el) => openViewer(collageItems, collageItems.indexOf(item), el),
      });
    }

    // Re-layout (no animation) after rotation / resize
    let collageResizeTimer = null;
    addEventListener('resize', () => {
      clearTimeout(collageResizeTimer);
      collageResizeTimer = setTimeout(() => { if (collageItems) mountCollage(); }, 200);
    });

    // Hover on name — blur all photos
    const introName = document.getElementById('intro-name');
    introName.addEventListener('mouseenter', () => collageContainer.classList.add('has-hover'));
    introName.addEventListener('mouseleave', () => collageContainer.classList.remove('has-hover'));

    // Info page — text renders at once; the portrait loads on its own.
    // Bio: blank lines → paragraphs; single line breaks are soft (width is set in ch).
    const _infoC      = CONFIG.pageContent?.info || {};
    const _infoLabel  = _infoC.label          || 'About';
    const _infoRole   = _infoC.role           || `Melbourne based. ${CONFIG.tagline}.`;
    const _ig2Label   = _infoC.instagram2Label || '@babyjuanmoretime';
    const _ig2Url     = _infoC.instagram2Url   || 'https://instagram.com/babyjuanmoretime';
    const _bioHtml    = String(CONFIG.about?.bio || '').split(/\n\s*\n/)
      .map(p => p.trim().replace(/\s*\n\s*/g, ' ')).filter(Boolean)
      .map(p => `<p>${p}</p>`).join('');
    const _clients    = (CONFIG.clientLogos || []).filter(l => l.url);
    document.getElementById('page-info').innerHTML = `
      <div class="about-inner">
        <div class="about-img-wrap ph">
          <img class="about-photo" src="${Core.img(CONFIG.about.photo, 1080)}" srcset="${Core.srcset(CONFIG.about.photo, CONFIG.about.width)}"
               sizes="(max-width: 600px) 100vw, 45vw" alt="${CONFIG.name}" decoding="async" loading="lazy"
               ${CONFIG.about.width ? `width="${CONFIG.about.width}" height="${CONFIG.about.height}"` : ''} />
        </div>
        <div class="about-text">
          <h1 class="about-title">${_infoLabel}</h1>
          <p class="about-role">${_infoRole}</p>
          <div class="about-bio">${_bioHtml}</div>
          <div class="about-contact">
            <p class="about-contact-label">${_introC.footerCta1 || 'Got a project?'}</p>
            <a class="about-email" href="mailto:${CONFIG.email}">${CONFIG.email}</a>
            <div class="about-links">
              <a href="${CONFIG.instagramUrl}" target="_blank" rel="noopener">${CONFIG.instagram} <span class="about-link-note">Portfolio</span></a>
              <a href="${_ig2Url}" target="_blank" rel="noopener">${_ig2Label} <span class="about-link-note">Personal</span></a>
            </div>
          </div>
          ${_clients.length ? `
          <section class="about-clients" aria-labelledby="about-clients-title">
            <h2 class="about-clients-title" id="about-clients-title">Selected clients</h2>
            <ul class="about-clients-list">
              ${_clients.map(l => `<li><img src="${Core.esc(l.url)}" alt="${Core.esc(l.name)}" loading="lazy" decoding="async" /></li>`).join('')}
            </ul>
          </section>` : ''}
        </div>
      </div>
    `;

    // Contact CTA reused at the end of every gallery
    const contactCta = () => `
      <aside class="contact-cta" aria-label="Contact">
        <p class="contact-cta__label">${Core.esc(_introC.footerCta1 || 'Got a project?')}</p>
        <a class="contact-cta__link" href="${pageUrlFor('info')}">${Core.esc(_introC.footerCta2 || "Let's work together.")}</a>
      </aside>`;
    function pageUrlFor(id) {
      const m = (CONFIG.allPages || []).find(p => p.id === id);
      return m ? '/' + m.slug : '/' + id;
    }
    document.getElementById('grid-things').insertAdjacentHTML('afterend', contactCta());
    document.querySelectorAll('.gallery-end-cta').forEach(el => {
      el.href = pageUrlFor('info');
      el.textContent = (_introC.footerCta2 || "Let's work together.").replace(/\.$/, '') + ' →';
    });

    /* ════════════════════════════════════════════════════════
       PAGE MANAGEMENT
       ════════════════════════════════════════════════════════ */
    let currentPage = (typeof CONFIG !== 'undefined' && CONFIG.homePage) ? CONFIG.homePage : 'intro';
    let isTransitioning = false;

    // Page configuration
    const pages = ['intro', 'people', 'things', 'personal-v2', 'info', 'archive'];

    // Every photo opens the shared viewer (assets/viewer.js)
    function openViewer(items, index, imgEl) {
      Viewer.open(items, Math.max(0, index), imgEl);
    }

    function showPage(page) {
      // Clean up carousels / archive when leaving
      if (carouselCleanup)         { carouselCleanup();         carouselCleanup = null; }
      if (personalV2Cleanup)       { personalV2Cleanup();       personalV2Cleanup = null; }
      if (archiveParallaxCleanup)  { archiveParallaxCleanup();  archiveParallaxCleanup = null; }

      // Hide all pages (hidden: not rendered, not in the a11y tree, no stray h1)
      pages.forEach(p => {
        const el = document.getElementById(`page-${p}`);
        if (el) { el.classList.remove('active'); el.hidden = true; }
      });

      // Remove all page-* body classes
      pages.forEach(p => document.body.classList.remove(`page-${p}`));

      // Set new page
      document.body.classList.add(`page-${page}`);
      const target = document.getElementById(`page-${page}`);
      if (target) { target.hidden = false; target.classList.add('active'); }


      currentPage = page;
      window.scrollTo({ top: 0 });
      document.body.classList.toggle('hide-logo', page === homeId);

      // Render content for each page.
      // tpl = the template key for this page from CONFIG.pageTemplates.
      // When a page has no pageTemplates entry (unmapped/legacy), tpl falls back to
      // the raw page ID — the || tpl === 'X' branches below catch those legacy IDs.
      const tpl = (typeof CONFIG !== 'undefined' && CONFIG.pageTemplates?.[page]) || page;

      if      (tpl === 'intro')                                         { return mountCollage(); }
      else if (tpl === 'carousel'            || tpl === 'people')      { renderCarousel(page); }
      else if (tpl === 'grid'                || tpl === 'things')      { renderMasonryGrid(page); }
      else if (tpl === 'fullscreen-carousel' || tpl === 'personal-v2') { renderPersonalCarousel(); }
      else if (tpl === 'archive')                                       { renderArchiveGallery(); archiveParallaxCleanup = initArchiveParallax(); }
      // info / custom — static HTML, text is ready immediately (the portrait loads on its own).
      // archive-standalone / filmstrip — external .html files, never reach showPage().
      if (tpl === 'info') return Promise.resolve();
      // Uncover once the page's first image is decoded (the wipe caps this at 800 ms)
      return Core.decoded(target && target.querySelector('img[fetchpriority="high"]'));
    }

    /* ════════════════════════════════════════════════════════
       WIPE TRANSITION
       ════════════════════════════════════════════════════════ */
    const STANDALONE = ['archive-standalone', 'filmstrip', 'elastic-grid'];
    const homeId = CONFIG.homePage || 'intro';

    function pageMeta(id) { return (CONFIG.allPages || []).find(p => p.id === id); }
    function pageUrl(id) {
      if (id === homeId) return '/';
      const m = pageMeta(id);
      return '/' + ((m && m.slug) || id);
    }

    function syncDocument(page) {
      const meta = pageMeta(page);
      document.title = (meta && meta.pageTitle) || CONFIG.name || document.title;
      Core.setCurrent(location.pathname);
    }

    // fromHistory: true when called from popstate (the URL already changed)
    function navigateTo(targetPage, fromHistory) {
      if (isTransitioning || currentPage === targetPage) return;

      // Standalone pages are separate documents
      const meta = pageMeta(targetPage);
      if (meta && STANDALONE.includes(meta.template)) {
        if (fromHistory) location.reload(); else Core.go(pageUrl(targetPage));
        return;
      }

      isTransitioning = true;
      Core.wipe(() => {
        Core.closeMenu({ instant: true, keepFocus: true });
        // Real history entries: Back/Forward walk the sections (popstate below)
        if (!fromHistory) history.pushState({ page: targetPage }, '', pageUrl(targetPage));
        const ready = showPage(targetPage);
        syncDocument(targetPage);
        focusMain();
        return ready;
      }).then(() => { isTransitioning = false; });
    }

    addEventListener('popstate', () => {
      const id = resolvePath(location.pathname);
      if (id) navigateTo(id, true);
      else location.reload();
    });

    // After an in-document navigation, move focus to the new view (screen readers announce it)
    function focusMain() {
      const h = document.querySelector('.page-section.active h1, .page-section.active');
      if (!h) return;
      if (!h.hasAttribute('tabindex')) h.setAttribute('tabindex', '-1');
      h.focus({ preventScroll: true });
    }

    // Links (menu, logo, CTAs) to SPA sections are handled in-document
    Core.onRoute = (url) => {
      const id = resolvePath(url.pathname);
      if (!id) return false;
      navigateTo(id);
      return true;
    };

    /* ════════════════════════════════════════════════════════
       CAROUSEL (People)
       ════════════════════════════════════════════════════════ */
    let carouselIdx = 0;
    let carouselCleanup = null;
    let archiveParallaxCleanup = null;

    // People: the active photo is centred from real geometry (offsetLeft/Width),
    // recomputed after images decode and whenever the stage resizes.
    function renderCarousel(pageId) {
      const pid = pageId || 'people';
      const section = document.getElementById(`page-${pid}`);
      const stage = section && section.querySelector('.carousel-container');
      const track = stage && stage.querySelector('.carousel-track');
      const counterEl = section && section.querySelector('.gallery-counter');
      if (!track) return;

      if (carouselCleanup) { carouselCleanup(); carouselCleanup = null; }
      track.innerHTML = '';
      carouselIdx = 0;

      const items = CONFIG.pageGalleries?.[pid] || CONFIG.pageGalleries?.people || [];

      items.forEach((proj, idx) => {
        const slide = document.createElement('div');
        slide.className = 'carousel-slide';
        slide.style.setProperty('--ar', Core.ratio(proj) || 0.75);
        slide.innerHTML = `
          <div class="portfolio-item-img-wrap ph">
            <img ${Core.imgAttrs(proj, { w: 1080, sizes: '(max-width: 600px) 90vw, 50vw', high: idx === 0, eager: idx < 3, draggable: false })} />
          </div>`;
        track.appendChild(slide);
      });
      const slides = [...track.children];
      stage.dataset.cursor = 'Drag';
      stage.setAttribute('aria-roledescription', 'carousel');

      function update(animate = true) {
        const s = slides[carouselIdx];
        if (!s) return;
        const offset = stage.clientWidth / 2 - (s.offsetLeft + s.offsetWidth / 2);
        track.style.transition = animate && !Core.reduceMotion.matches ? '' : 'none';
        track.style.transform = `translateX(${offset.toFixed(1)}px)`;
        slides.forEach((el, i) => {
          const on = i === carouselIdx;
          el.classList.toggle('active', on);
          el.dataset.cursor = on ? 'View' : 'Drag';
          const img = el.querySelector('img');
          img.setAttribute('tabindex', on ? '0' : '-1');
          img.setAttribute('role', 'button');
        });
        if (counterEl) counterEl.textContent = Core.counter(carouselIdx, items.length);
        const endCta = section.querySelector('.gallery-end-cta');
        if (endCta) endCta.hidden = carouselIdx !== items.length - 1;
      }

      function goToSlide(idx) {
        carouselIdx = Math.max(0, Math.min(idx, items.length - 1));
        update();
      }

      // Click/Enter: active photo opens the viewer, others become active
      slides.forEach((slide, i) => {
        slide.addEventListener('click', () => {
          if (didSwipe) return;
          if (i === carouselIdx) openViewer(items, i, slide.querySelector('img'));
          else goToSlide(i);
        });
        slide.querySelector('img').addEventListener('keydown', e => {
          if ((e.key === 'Enter' || e.key === ' ') && i === carouselIdx) { e.preventDefault(); openViewer(items, i, e.target); }
        });
      });

      const keyHandler = (e) => {
        if (Viewer.isOpen() || document.body.classList.contains('menu-open')) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); goToSlide(carouselIdx + 1); }
        if (e.key === 'ArrowLeft')  { e.preventDefault(); goToSlide(carouselIdx - 1); }
      };
      document.addEventListener('keydown', keyHandler);

      // Wheel / trackpad: one photo per gesture
      const stopWheel = Core.wheelSteps(stage, dir => { if (!Viewer.isOpen()) goToSlide(carouselIdx + dir); });

      // Swipe (touch, pen) and mouse drag
      let sx = 0, sy = 0, tracking = false, didSwipe = false;
      const onDown = e => { tracking = true; didSwipe = false; sx = e.clientX; sy = e.clientY; };
      const onUp = e => {
        if (!tracking) return;
        tracking = false;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { didSwipe = true; goToSlide(carouselIdx + (dx < 0 ? 1 : -1)); }
      };
      const onCancel = () => { tracking = false; };
      stage.addEventListener('pointerdown', onDown);
      stage.addEventListener('pointerup', onUp);
      stage.addEventListener('pointercancel', onCancel);

      // Re-centre when the stage resizes and once the active photo is decoded
      const ro = new ResizeObserver(() => update(false));
      ro.observe(stage);
      Core.decoded(slides[0] && slides[0].querySelector('img')).then(() => update(false));

      document.body.style.overflow = 'hidden';
      window.scrollTo({ top: 0 });

      carouselCleanup = () => {
        document.removeEventListener('keydown', keyHandler);
        stopWheel();
        ro.disconnect();
        stage.removeEventListener('pointerdown', onDown);
        stage.removeEventListener('pointerup', onUp);
        stage.removeEventListener('pointercancel', onCancel);
        document.body.style.overflow = '';
      };

      update(false);
    }

    /* ════════════════════════════════════════════════════════
       MASONRY GRID (Things)
       ════════════════════════════════════════════════════════ */
    function renderMasonryGrid(category) {
      const gridId = `grid-${category}`;
      const grid = document.getElementById(gridId);
      if (!grid) return;

      grid.innerHTML = '';
      const items = CONFIG.pageGalleries?.[category] || CONFIG.projects.filter(p => p.categories.includes(category));

      const colCount = window.innerWidth <= 600 ? 1 : window.innerWidth <= 768 ? 2 : 3;
      const columns = [];
      for (let i = 0; i < colCount; i++) {
        const col = document.createElement('div');
        col.className = 'portfolio-column';
        columns.push(col);
        grid.appendChild(col);
      }

      items.forEach((proj, idx) => {
        const div = document.createElement('div');
        div.className = 'portfolio-item';
        div.dataset.cursor = 'View';
        div.setAttribute('tabindex', '0');
        div.setAttribute('role', 'button');
        div.setAttribute('aria-label', proj.title);
        div.innerHTML = `
          <div class="portfolio-item-img-wrap ph" style="aspect-ratio:${Core.ratio(proj) || 0.75}">
            <img ${Core.imgAttrs(proj, { w: 640, sizes: '(max-width: 600px) calc(100vw - 32px), (max-width: 768px) 46vw, 28vw', high: idx === 0, eager: idx < 3 })} />
          </div>
        `;
        div.addEventListener('click', () => openViewer(items, idx, div.querySelector('img')));
        div.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(items, idx, div.querySelector('img')); }
        });

        // Round-robin: (idx + 1) % 3 puts extras in middle column
        const colIdx = colCount === 3 ? ((idx + 1) % colCount) : (idx % colCount);
        columns[colIdx].appendChild(div);
      });

      requestAnimationFrame(() => animateItems(grid));
    }

    /* ════════════════════════════════════════════════════════
       PERSONAL V2 — TRANSFORM-BASED CAROUSEL
       ════════════════════════════════════════════════════════ */
    let personalV2Cleanup = null;

    function renderPersonalCarousel() {
      const container = document.getElementById('personal-v2-carousel');
      const counterEl = document.getElementById('personal-v2-counter');
      if (!container) return;

      // Clean up previous instance
      if (personalV2Cleanup) { personalV2Cleanup(); personalV2Cleanup = null; }
      container.innerHTML = '';

      // Force critical styles (preview browser may cache CSS)
      container.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;overflow:visible;cursor:grab;user-select:none;-webkit-user-select:none;';

      const items = CONFIG.pageGalleries?.['personal-v2'] || CONFIG.projects.filter(p => p.categories.includes('personal'));
      const total = items.length;
      if (!total) return;

      let activeIndex = 0;
      let isAnimating = false;
      let dragStartX = 0;
      let dragOffset = 0;
      let isDragging = false;
      let didDrag = false;

      // Sizing — spacing between slide centers
      const getSpacing = () => {
        const vw = window.innerWidth;
        if (vw < 600) return vw * 0.65;
        if (vw < 900) return vw * 0.50;
        return Math.min(vw * 0.42, 600);
      };
      const ACTIVE_SCALE = 1.25;
      const INACTIVE_SCALE = 0.78;
      const TRANSITION_DURATION = 900; // ms

      // Create DOM items
      const imgHeight = Math.max(180, Math.min(window.innerHeight * 0.34, 420));
      const slides = items.map((proj, idx) => {
        const slide = document.createElement('div');
        slide.className = 'pv2-slide';
        slide.style.cssText = 'position:absolute;top:0;left:0;transform-origin:center center;will-change:transform,opacity;';
        slide.innerHTML = `<img ${Core.imgAttrs(proj, { w: 1080, sizes: '(max-width: 600px) 75vw, 50vw', high: idx === 0, eager: idx < 3, draggable: false })} />`;
        const img = slide.firstElementChild;
        // On mobile, cap width so that after ACTIVE_SCALE(1.25) visual = ~75vw with breathing room
        const _maxImgW = window.innerWidth < 600 ? '60vw' : '80vw';
        img.style.cssText = `height:${imgHeight}px;width:auto;max-width:${_maxImgW};object-fit:contain;display:block;pointer-events:none;`;
        slide.addEventListener('click', () => {
          if (didDrag) { didDrag = false; return; }
          if (idx === activeIndex) {
            openViewer(items, idx, slide.querySelector('img'));
          } else {
            goTo(idx);
          }
        });
        container.appendChild(slide);
        return slide;
      });

      // Gap between edges of adjacent images (px)
      const IMG_GAP = 96;

      // Position all slides based on active index + optional drag offset
      function layoutSlides(animate) {
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const cx = cw / 2;
        const cy = ch / 2;

        // Pre-compute each slide's natural width (unscaled) and its scale
        const slideData = slides.map((slide, i) => {
          const img = slide.querySelector('img');
          const naturalW = img ? img.clientWidth : 200;
          const naturalH = img ? img.clientHeight : 200;
          const scale = i === activeIndex ? ACTIVE_SCALE : INACTIVE_SCALE;
          return { naturalW, naturalH, scale, scaledW: naturalW * scale };
        });

        // Compute X center for each slide by walking outward from active
        const centerXs = new Array(slides.length).fill(0);
        centerXs[activeIndex] = cx;

        // Walk right from active
        for (let i = activeIndex + 1; i < slides.length; i++) {
          const prevHalfW = slideData[i - 1].scaledW / 2;
          const currHalfW = slideData[i].scaledW / 2;
          centerXs[i] = centerXs[i - 1] + prevHalfW + IMG_GAP + currHalfW;
        }
        // Walk left from active
        for (let i = activeIndex - 1; i >= 0; i--) {
          const nextHalfW = slideData[i + 1].scaledW / 2;
          const currHalfW = slideData[i].scaledW / 2;
          centerXs[i] = centerXs[i + 1] - nextHalfW - IMG_GAP - currHalfW;
        }

        slides.forEach((slide, i) => {
          const rel = i - activeIndex;
          const { naturalW, naturalH, scale } = slideData[i];
          const z = i === activeIndex ? 10 : 1;
          const opacity = Math.abs(rel) > 6 ? 0 : 1;

          // Position so the slide's visual center lands at centerXs[i]
          const x = centerXs[i] + dragOffset - naturalW / 2;
          const y = cy - naturalH / 2;

          if (animate) {
            slide.style.transition = `transform ${TRANSITION_DURATION}ms cubic-bezier(0.16, 1, 0.3, 1)`;
          } else {
            slide.style.transition = 'none';
          }

          slide.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
          slide.style.zIndex = z;
          slide.dataset.cursor = i === activeIndex ? 'View' : 'Drag';
          slide.style.opacity = opacity;
        });
      }

      // Update caption & counter
      function updateCaption() {
        const proj = items[activeIndex];
        counterEl.textContent = Core.counter(activeIndex, total);
        const endCta = container.parentElement.querySelector('.gallery-end-cta');
        if (endCta) endCta.hidden = activeIndex !== total - 1;
      }

      // Navigate to a specific index — never blocks input
      function goTo(idx, animated = true) {
        const newIdx = Math.max(0, Math.min(idx, total - 1));
        activeIndex = newIdx;
        dragOffset = 0;
        layoutSlides(animated);
        updateCaption();
      }

      function goNext() { if (activeIndex < total - 1) goTo(activeIndex + 1); }
      function goPrev() { if (activeIndex > 0) goTo(activeIndex - 1); }

      // ── Wheel / trackpad: one photo per gesture (Core.wheelSteps) ──
      let stopWheel = null;

      // ── Mouse drag ──
      function onMouseDown(e) {
        isDragging = true;
        didDrag = false;
        dragStartX = e.clientX;
        dragOffset = 0;
        // Cancel any running CSS transitions so drag feels immediate
        slides.forEach(s => { s.style.transition = 'none'; });
        container.style.cursor = 'grabbing';
      }
      function onMouseMove(e) {
        if (!isDragging) return;
        dragOffset = e.clientX - dragStartX;
        if (Math.abs(dragOffset) > 5) didDrag = true;
        layoutSlides(false);
      }
      function onMouseUp() {
        if (!isDragging) return;
        isDragging = false;
        container.style.cursor = '';
        const threshold = getSpacing() * 0.18;
        if (dragOffset > threshold) goPrev();
        else if (dragOffset < -threshold) goNext();
        else { dragOffset = 0; layoutSlides(true); }
      }

      // ── Touch drag ──
      function onTouchStart(e) {
        isDragging = true;
        didDrag = false;
        dragStartX = e.touches[0].clientX;
        dragOffset = 0;
        slides.forEach(s => { s.style.transition = 'none'; });
      }
      function onTouchMove(e) {
        if (!isDragging) return;
        // Prevent browser from scrolling the page — this carousel is full-screen and must not scroll
        e.preventDefault();
        dragOffset = e.touches[0].clientX - dragStartX;
        if (Math.abs(dragOffset) > 5) didDrag = true;
        layoutSlides(false);
      }
      function onTouchEnd() {
        if (!isDragging) return;
        isDragging = false;
        const threshold = getSpacing() * 0.18;
        if (dragOffset > threshold) goPrev();
        else if (dragOffset < -threshold) goNext();
        else { dragOffset = 0; layoutSlides(true); }
      }

      // ── Keyboard ──
      function onKeyDown(e) {
        if (currentPage !== 'personal-v2' || Viewer.isOpen() || document.body.classList.contains('menu-open')) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goNext(); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goPrev(); }
      }

      // ── Resize ──
      function onResize() { layoutSlides(false); }

      // Attach events
      stopWheel = Core.wheelSteps(container, dir => { if (!Viewer.isOpen()) (dir > 0 ? goNext() : goPrev()); });
      container.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      container.addEventListener('touchstart', onTouchStart, { passive: true });
      container.addEventListener('touchmove', onTouchMove, { passive: false }); // non-passive: allows preventDefault to block page scroll
      container.addEventListener('touchend', onTouchEnd);
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('resize', onResize);

      // Initial layout (no animation), then animate in after images start loading
      goTo(0, false);

      // Re-layout once first few images load so dimensions are correct
      let loadCount = 0;
      slides.forEach((slide, i) => {
        const img = slide.querySelector('img');
        if (img) {
          const onLoad = () => {
            loadCount++;
            if (loadCount <= 5) layoutSlides(loadCount === 1);
          };
          if (img.complete) onLoad();
          else img.addEventListener('load', onLoad, { once: true });
        }
      });

      container.dataset.cursor = 'Drag';

      // Lock body scroll for the duration of this page (prevents iOS rubber-band and layout shift)
      document.body.style.overflow = 'hidden';

      // Cleanup
      personalV2Cleanup = () => {
        stopWheel();
        container.removeEventListener('mousedown', onMouseDown);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        container.removeEventListener('touchstart', onTouchStart);
        container.removeEventListener('touchmove', onTouchMove);
        container.removeEventListener('touchend', onTouchEnd);
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('resize', onResize);
        document.body.style.overflow = '';
        container.innerHTML = '';
        counterEl.textContent = '';
      };
    }

    /* ── Scroll reveal animation ─────────────────────── */
    let scrollObs = null;
    function animateItems(container) {
      if (scrollObs) scrollObs.disconnect();
      const items = container.querySelectorAll('.portfolio-item');
      items.forEach(el => { el.style.transitionDelay = '0ms'; });

      // Each item reveals once it is in view AND its photo is decoded
      // (its placeholder box holds the space meanwhile — no layout shift).
      scrollObs = new IntersectionObserver(entries => {
        const newEntries = entries.filter(e => e.isIntersecting);
        newEntries.forEach((entry, i) => {
          scrollObs.unobserve(entry.target);
          if (Core.reduceMotion.matches) { entry.target.classList.add('visible'); return; }
          entry.target.style.transitionDelay = `calc(${i} * var(--stagger))`;
          Core.decoded(entry.target.querySelector('img'), 1500)
            .then(() => requestAnimationFrame(() => entry.target.classList.add('visible')));
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -40px 0px' });
      items.forEach(el => scrollObs.observe(el));
    }

    /* ════════════════════════════════════════════════════════
       ARCHIVE — Parallax image gallery
       Access via: yoursite.com/#archive
       ════════════════════════════════════════════════════════ */

    // Parallax speeds per column (6 columns, symmetrical)
    // Negative → column rises faster; positive → column lags
    const ARCHIVE_SPEEDS = [-0.03, 0.012, 0.042, -0.042, -0.012, 0.03];

    function renderArchiveGallery() {
      const grid = document.getElementById('archive-grid');
      if (!grid || grid.hasChildNodes()) return;

      // Build image list from archive gallery, cycle to fill 54 slots
      const archiveSource = CONFIG.pageGalleries?.archive || CONFIG.projects;
      const base = archiveSource;
      const images = [];
      for (let i = 0; images.length < 54; i++) {
        images.push(base[i % base.length]);
      }

      images.forEach((item, i) => {
        const col  = i % 6;
        const cell = document.createElement('div');
        cell.className    = 'archive-cell';
        cell.dataset.speed = ARCHIVE_SPEEDS[col];

        const wrap = document.createElement('div');
        wrap.className = 'archive-item';
        wrap.innerHTML = `<img ${Core.imgAttrs(item, { w: 640, sizes: '(max-width: 600px) 33vw, 17vw', high: i === 0, eager: i < 6 })} />`;
        cell.appendChild(wrap);
        grid.appendChild(cell);

        cell.setAttribute('role', 'button');
        cell.setAttribute('tabindex', '0');
        cell.setAttribute('aria-label', `Open photo ${(i % base.length) + 1} of ${base.length}${item.alt ? ': ' + item.alt : ''}`);
        const open = () => openViewer(base, i % base.length, cell.querySelector('img'));
        cell.addEventListener('click', open);
        cell.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });

        cell.dataset.cursor = 'View';
      });

      updateArchiveParallax(0);
    }

    function updateArchiveParallax(drift) {
      const cells = document.querySelectorAll('#archive-grid .archive-cell');
      cells.forEach(cell => {
        const speed = parseFloat(cell.dataset.speed);
        // drift = velocity-based offset (px/frame), scaled per column speed
        cell.style.transform = `translate3d(0, ${(drift * speed * 7).toFixed(2)}px, 0)`;
      });
    }

    function initArchiveParallax() {
      let lastScrollY  = window.scrollY;
      let pendingDelta = 0;   // raw scroll delta accumulated since last rAF tick
      let smoothedVel  = 0;   // stage 1: absorbs raw delta quickly — no binary switch
      let driftOffset  = 0;   // stage 2: follows smoothedVel gently — drives display
      let rafId        = null;

      function onScroll() {
        const y      = window.scrollY;
        pendingDelta += y - lastScrollY;
        lastScrollY   = y;
      }

      function tick() {
        if (!Viewer.isOpen()) {
          const raw    = Math.max(-50, Math.min(50, pendingDelta));
          pendingDelta = 0;

          // Two-stage continuous smoothing — no binary rate switch, no micro-jumps.
          // Stage 1: smoothedVel tracks raw delta at a fast but smooth rate.
          // Stage 2: driftOffset follows smoothedVel at a gentler rate.
          // When scroll stops, both decay to 0 continuously at their own pace.
          smoothedVel  += (raw         - smoothedVel)  * 0.22;
          driftOffset  += (smoothedVel - driftOffset)  * 0.10;

          if (Math.abs(driftOffset) > 0.3) {
            updateArchiveParallax(driftOffset);
          } else {
            smoothedVel = 0;
            driftOffset = 0;
            updateArchiveParallax(0);
          }
        }
        rafId = requestAnimationFrame(tick);
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      rafId = requestAnimationFrame(tick);

      return () => {
        window.removeEventListener('scroll', onScroll);
        cancelAnimationFrame(rafId);
      };
    }

    // Pathname-based deep linking — /people, /things, /lab/grid…
    // Resolves a path to an SPA section id via CONFIG.allPages.
    function resolvePath(pathname) {
      const slug = pathname.replace(/^\/+|\/+$/g, '');
      if (!slug) return pages.includes(homeId) ? homeId : null;
      if (pages.includes(slug)) return slug;
      const bySlug = (CONFIG.allPages || []).find(p => (p.slug || p.id) === slug && pages.includes(p.id));
      return bySlug ? bySlug.id : null;
    }

    {
      // The server tells us which page it resolved (also covers /lab/<alias>)
      const served = document.querySelector('meta[name="jr:page"]')?.content;
      const legacyHash = location.hash.slice(1);
      const initial = (served && pages.includes(served) && served)
        || resolvePath(location.pathname)
        || (legacyHash && resolvePath('/' + legacyHash))
        || currentPage;
      const homeMeta = pageMeta(initial);
      if (homeMeta && STANDALONE.includes(homeMeta.template)) {
        location.replace('/' + (homeMeta.slug || initial));
      } else {
        history.replaceState({ page: initial }, '', location.pathname + location.search);
        Core.ready(showPage(initial));
        syncDocument(initial);
      }
    }

  })();
  </script>

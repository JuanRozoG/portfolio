<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!--core:head-->
  <style>
    
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
        :root {
          --fw: 900;
          --red: #ff3232;
          --page-padding: 3vw;
          --c-gap: 44px;
          --r-gap: 88px;
          --column-count: 6;
        }
    
        html {
          font-size: 14px;
        }
    
        html, body {
          width: 100%;
          background: #fff;
        }
    
        body {
          font-family: var(--font-display);
          font-weight: var(--fw);
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }
    
        /* ── Grid layout ──────────────────────────────────────────── */
        #smooth-wrapper {
          overflow: hidden;
          position: fixed;
          inset: 0;
        }
    
        #smooth-content {
          will-change: transform;
        }
    
        /* ── Grid — 6 equal columns, archive-style spacing ─────────── */
        .eg-grid {
          display: grid;
          padding: 72px var(--page-padding) 140px;
          margin: 0 auto;
          grid-template-columns: repeat(var(--column-count), 1fr);
          column-gap: var(--c-gap);
          row-gap: 0; /* vertical spacing managed per-column by flex gap */
        }
    
        /* Each column strip — ScrollSmoother applies lag here */
        .eg-grid__column {
          display: flex;
          flex-direction: column;
          gap: var(--r-gap);
        }
    
        /* Item — square footprint, matching archive cell */
        .eg-grid__item {
          margin: 0;
          position: relative;
        }
    
        /* Square container with breathing-room scale (archive: scale 0.9) */
        .eg-grid__item-img {
          aspect-ratio: 1 / 1;
          overflow: hidden;
          display: block;
          width: 100%;
          transform: scale(0.9);
          transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
        }
    
    
    
        /* Image fills the square, fully visible (contain not crop) */
        .eg-grid__item-img img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
          pointer-events: none;
          user-select: none;
          -webkit-user-select: none;
        }
    
        /* Responsive column counts + gaps — mirrors archive breakpoints */
        @media (max-width: 1100px) {
          :root { --column-count: 5; --c-gap: 36px; --r-gap: 72px; }
        }
        @media (max-width: 860px) {
          :root { --column-count: 4; --c-gap: 24px; --r-gap: 48px; }
          .eg-grid { padding-top: 70px; padding-bottom: 100px; }
        }
        @media (max-width: 600px) {
          :root { --column-count: 3; --c-gap: 16px; --r-gap: 32px; }
          .eg-grid { padding-top: 64px; padding-bottom: 80px; }
        }
        @media (max-width: 380px) {
          :root { --column-count: 2; --c-gap: 12px; --r-gap: 24px; }
          .eg-grid { padding-top: 60px; padding-bottom: 60px; }
        }
    
        /* ── Chrome UI ──────────────────────────────────────────────── */
    
    
        @keyframes uiIn {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: translateY(0); }
        }
    
        /* Empty state */
        .eg-empty {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 11px;
          letter-spacing: .15em;
          text-transform: uppercase;
          color: rgba(10,10,10,.3);
        }
    
        .eg-grid__item:focus-visible { outline-offset: 4px; }
    
        /* Reduced motion: no ScrollSmoother — plain document scroll */
        html.no-smoother #smooth-wrapper { position: static; overflow: visible; }
    
    /* Hover effects only where hover exists (no sticky hover on touch) */
    @media (hover: hover) {
      /* Subtle hover lift — same ratio as archive (0.9 × 1.04 = 0.936) */
        .eg-grid__item:hover .eg-grid__item-img {
          transform: scale(0.936);
        }
    }
  </style>
</head>
<body>

  <!-- ── ScrollSmoother wrapper ─────────────────────────────────── -->
  <main id="main">
  <h1 class="visually-hidden">Grid</h1>
  <div id="smooth-wrapper">
    <div id="smooth-content">
      <div class="eg-grid" id="eg-grid">
        <!-- populated by JS from CONFIG.pageGalleries -->
      </div>
    </div>
  </div>
  </main>

  <!-- GSAP stack -->
  <script src="/js/elastic-grid/gsap.min.js"></script>
  <script src="/js/elastic-grid/ScrollTrigger.min.js"></script>
  <script src="/js/elastic-grid/ScrollSmoother.min.js"></script>

  <!-- Portfolio config -->
  <script src="/config.js"></script>

  <script>
  (() => {
    'use strict';

    /* ── Pull images from config ───────────────────────────────── */
    const pageId   = 'elastic-grid-v1';
    const galleries = CONFIG.pageGalleries || {};
    let pool = galleries[pageId] || [];

    // Fallback: use all available images if this page has no gallery yet
    if (!pool.length) {
      pool = Object.values(galleries).flat();
    }

    const grid = document.getElementById('eg-grid');

    if (!pool.length) {
      grid.innerHTML = '';
      document.body.insertAdjacentHTML('beforeend',
        '<div class="eg-empty">No images available</div>');
      return;
    }

    /* ── Build grid items ──────────────────────────────────────── */
    pool.forEach((item, idx) => {
      const src = (item.image || item.url || '');

      const figure = document.createElement('figure');
      figure.className = 'eg-grid__item';
      figure.tabIndex = 0;
      figure.setAttribute('role', 'button');
      figure.setAttribute('aria-label', `Open photo ${idx + 1} of ${pool.length}${item.alt ? ': ' + item.alt : ''}`);
      figure.dataset.cursor = 'View';
      const open = () => Viewer.open(pool, idx, figure.querySelector('img'), {
        onOpen:  () => smoother && smoother.paused(true),
        onClose: () => smoother && smoother.paused(false),
      });
      figure.addEventListener('click', open);
      figure.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });

      const imgWrap = document.createElement('div');
      imgWrap.className = 'eg-grid__item-img';

      imgWrap.innerHTML = `<img ${Core.imgAttrs(item, { w: 640, sizes: '(max-width: 600px) 33vw, 17vw', draggable: false, high: idx === 0 })} />`;
      figure.appendChild(imgWrap);
      grid.appendChild(figure);
    });

    /* ── Elastic scroll engine (GSAP) ─────────────────────────── */
    gsap.registerPlugin(ScrollTrigger, ScrollSmoother);

    // Reduced motion → no smoothing at all; touch → native scroll (no normalizeScroll)
    const smoother = Core.reduceMotion.matches ? null : ScrollSmoother.create({
      wrapper:         '#smooth-wrapper',
      content:         '#smooth-content',
      smooth:          1,
      effects:         true,
      smoothTouch:     false,
      normalizeScroll: !Core.coarsePointer.matches,
    });
    if (!smoother) document.documentElement.classList.add('no-smoother');

    const originalItems = Array.from(grid.querySelectorAll('.eg-grid__item'));

    const baseLag  = 0.5;  // lag on the center column
    const lagScale = 0.12; // additional lag per column from center

    function groupItemsByColumn() {
      const cols = window.getComputedStyle(grid)
        .getPropertyValue('grid-template-columns')
        .trim().split(' ').filter(Boolean).length;

      const columns = Array.from({ length: cols }, () => []);
      grid.querySelectorAll('.eg-grid__item').forEach((item, i) => {
        columns[i % cols].push(item);
      });
      return { columns, numColumns: cols };
    }

    function clearGrid() {
      grid.querySelectorAll('.eg-grid__column').forEach(c => c.remove());
      originalItems.forEach(item => grid.appendChild(item));
    }

    function buildGrid(columns, numColumns) {
      const frag   = document.createDocumentFragment();
      const mid    = (numColumns - 1) / 2;
      const result = [];

      columns.forEach((column, i) => {
        const distance = Math.abs(i - mid);
        const lag      = baseLag + distance * lagScale;
        const col      = document.createElement('div');
        col.className  = 'eg-grid__column';
        column.forEach(item => col.appendChild(item));
        frag.appendChild(col);
        result.push({ element: col, lag });
      });

      grid.appendChild(frag);
      return result;
    }

    function applyLag(colContainers) {
      if (!smoother) return;
      colContainers.forEach(({ element, lag }) => {
        smoother.effects(element, { speed: 1, lag });
      });
    }

    let currentCols = null;

    function init() {
      clearGrid();
      const { columns, numColumns } = groupItemsByColumn();
      currentCols = numColumns;
      const containers = buildGrid(columns, numColumns);
      applyLag(containers);
    }

    window.addEventListener('resize', () => {
      const n = window.getComputedStyle(grid)
        .getPropertyValue('grid-template-columns')
        .trim().split(' ').filter(Boolean).length;
      if (n !== currentCols) init();
    });

    /* ── Boot: cells are square placeholders, so no need to wait for images ── */
    init();
    Core.ready(Core.decoded(grid.querySelector('img[fetchpriority="high"]')));

  })();
  </script>

  <script src="/assets/viewer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!--core:head-->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--color-paper);
    }
    body {
      font-family: var(--font-display);
      font-weight: var(--fw-display);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Stage: one photo at a time, cross-dissolve ───────────── */
    .stage {
      position: fixed;
      inset: calc(var(--header-h) + var(--safe-top)) 0 calc(72px + var(--safe-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      opacity: 0;
      transition: opacity var(--dur-3) var(--ease-out);
      pointer-events: none;
    }
    .slide.active { opacity: 1; }
    .slide img {
      max-width: 76vw;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      animation: imgDrift 16s ease-in-out infinite alternate;
    }
    /* Slow, barely-perceptible drift — each image starts at a random phase */
    @keyframes imgDrift {
      from { transform: scale(1); }
      to   { transform: scale(1.038); }
    }
    @media (max-width: 600px) {
      .slide img { max-width: calc(100vw - 32px); }
    }

    /* ── Controls: counter · progress · pause ─────────────────── */
    .controls {
      position: fixed;
      left: var(--gutter);
      right: var(--gutter);
      bottom: max(16px, var(--safe-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
    }
    .controls .gallery-counter { margin: 0; }
    .controls__right { display: flex; align-items: center; gap: 4px; }
    .progress {
      width: 80px;
      height: 1px;
      margin-right: 8px;
      background: rgba(10, 10, 10, 0.12);
      overflow: hidden;
    }
    .progress__bar {
      height: 100%;
      background: var(--color-ink);
      transform: scaleX(0);
      transform-origin: 0 50%;
    }
    .ctrl-btn {
      min-width: var(--tap);
      min-height: var(--tap);
      padding: 0 8px;
      border: 0;
      background: none;
      color: var(--color-ink);
      font: var(--fw-display) 14px/1 var(--font-display);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity var(--dur-1) var(--ease-out);
    }
    @media (hover: hover) {
      .ctrl-btn:hover { opacity: var(--dim); }
    }
  </style>
</head>
<body>
  <main id="main">
    <h1 class="visually-hidden">Filmstrip</h1>
    <div class="stage" id="stage" role="region" aria-roledescription="slideshow" aria-label="Photos" data-cursor="Next"></div>
    <div class="controls">
      <p class="gallery-counter" id="counter" aria-live="polite"></p>
      <div class="controls__right">
        <div class="progress" aria-hidden="true"><div class="progress__bar" id="progress"></div></div>
        <button type="button" class="ctrl-btn" id="prev" aria-label="Previous photo">←</button>
        <button type="button" class="ctrl-btn" id="toggle" aria-pressed="false">Pause</button>
        <button type="button" class="ctrl-btn" id="next" aria-label="Next photo">→</button>
      </div>
    </div>
  </main>

  <script src="/config.js"></script>
  <script>
  (() => {
    'use strict';

    /* ── Admin-configurable timing (seconds), kept within 4–5 s per photo ── */
    const PAGE_ID = 'archive-filmstrip-v1';
    const _c   = (CONFIG.pageContent || {})[PAGE_ID] || {};
    const HOLD = Math.round(Math.min(5, Math.max(4, Number(_c.slideInterval) || 4.5)) * 1000);
    const IMG_COUNT = 15;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* ── Image pool: this page's gallery, else a balanced mix ── */
    const galleries = CONFIG.pageGalleries || {};
    let pool = shuffle(galleries[PAGE_ID] || []);
    if (!pool.length) {
      const per = Math.ceil(IMG_COUNT / 3);
      pool = shuffle([
        ...shuffle(galleries.people || []).slice(0, per),
        ...shuffle(galleries.things || []).slice(0, per),
        ...shuffle(galleries['personal-v2'] || []).slice(0, per),
      ]).slice(0, IMG_COUNT);
    }

    const stage     = document.getElementById('stage');
    const counterEl = document.getElementById('counter');
    const bar       = document.getElementById('progress');
    const toggleBtn = document.getElementById('toggle');
    if (!pool.length) { stage.textContent = 'No images available'; return; }

    const slides = pool.map((item, idx) => {
      const fig = document.createElement('figure');
      fig.className = 'slide';
      fig.setAttribute('aria-hidden', 'true');
      fig.innerHTML = `<img ${Core.imgAttrs(item, { w: 1600, sizes: '(max-width: 600px) calc(100vw - 32px), 76vw', high: idx === 0, eager: idx < 2, draggable: false })} />`;
      fig.firstElementChild.style.animationDelay = (-(Math.random() * 16)).toFixed(2) + 's';
      stage.appendChild(fig);
      return fig;
    });

    /* ── Sequencer: advances only when the next photo is decoded ── */
    let current = 0, timer = null, startedAt = 0, remaining = HOLD;
    let userPaused = Core.reduceMotion.matches;   // no autoplay with reduced motion
    let hoverPaused = false, hidden = document.hidden;
    const playing = () => !userPaused && !hoverPaused && !hidden;

    function show(i) {
      const prev = current;
      current = i;
      slides[prev].classList.remove('active');
      slides[prev].setAttribute('aria-hidden', 'true');
      slides[current].classList.add('active');
      slides[current].removeAttribute('aria-hidden');
      counterEl.textContent = Core.counter(current, slides.length);
      // Warm up the next one so it is decoded before its turn
      const next = slides[(current + 1) % slides.length].querySelector('img');
      if (next.loading === 'lazy') next.loading = 'eager';
    }

    function go(dir) {
      const target = (current + dir + slides.length) % slides.length;
      clearTimeout(timer);
      Core.decoded(slides[target].querySelector('img'), 3000).then(() => {
        show(target);
        remaining = HOLD;
        schedule();
      });
    }

    function setBar(fraction, ms) {
      bar.style.transition = 'none';
      bar.style.transform = `scaleX(${fraction})`;
      if (ms) {
        void bar.offsetWidth;
        bar.style.transition = `transform ${ms}ms linear`;
        bar.style.transform = 'scaleX(1)';
      }
    }

    function schedule() {
      clearTimeout(timer);
      timer = null;
      if (!playing()) { setBar(1 - remaining / HOLD, 0); return; }
      startedAt = performance.now();
      setBar(1 - remaining / HOLD, remaining);
      timer = setTimeout(() => go(1), remaining);
    }

    function pause() {
      if (timer) {
        clearTimeout(timer);
        timer = null;
        remaining = Math.max(0, remaining - (performance.now() - startedAt));
      }
      setBar(1 - remaining / HOLD, 0);
    }

    function sync() {
      toggleBtn.textContent = userPaused ? 'Play' : 'Pause';
      toggleBtn.setAttribute('aria-pressed', String(userPaused));
      if (playing()) schedule(); else pause();
    }

    // Pause on hover, while the tab is hidden, and with the button (WCAG 2.2.2)
    stage.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { hoverPaused = true; sync(); } });
    stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { hoverPaused = false; sync(); } });
    document.addEventListener('visibilitychange', () => { hidden = document.hidden; sync(); });
    toggleBtn.addEventListener('click', () => { userPaused = !userPaused; sync(); });

    // Click, arrow keys and buttons advance manually
    stage.addEventListener('click', () => go(1));
    document.getElementById('next').addEventListener('click', () => go(1));
    document.getElementById('prev').addEventListener('click', () => go(-1));
    document.addEventListener('keydown', e => {
      if (document.body.classList.contains('menu-open')) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    });

    // Boot: the first photo shows as soon as it is decoded, then the clock starts
    slides[0].classList.add('active');
    slides[0].removeAttribute('aria-hidden');
    counterEl.textContent = Core.counter(0, slides.length);
    const first = Core.decoded(slides[0].querySelector('img'), 3000);
    Core.ready(first);
    first.then(sync);
  })();
  </script>
</body>
</html>

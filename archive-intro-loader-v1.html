<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!--core:head-->
  <link rel="stylesheet" href="/style.css?v=17" />
</head>
<body class="page-intro hide-logo">
  <!--
    Lab: archived "Intro v2" — the intro collage with its original
    one-by-one stagger reveal. Shares the collage engine (/assets/collage.js)
    and the intro styles (style.css) with the home page.
  -->
  <main id="main">
    <section class="page page-section active" id="page-intro">
      <div class="intro-collage" id="intro-collage"></div>
      <div class="intro-center">
        <h1 class="intro-name" id="intro-name"></h1>
        <p class="intro-tagline" id="intro-tagline"></p>
      </div>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/assets/collage.js"></script>
  <script>
  (() => {
    'use strict';
    document.getElementById('intro-name').textContent = CONFIG.name;
    document.getElementById('intro-tagline').textContent = `Melbourne based. ${CONFIG.tagline}. EST 2020`;

    const g = CONFIG.pageGalleries || {};
    const pool = [...(g.people || []), ...(g.things || []), ...(g['personal-v2'] || [])];
    const items = Collage.pickBalanced(pool, 9);
    const container = document.getElementById('intro-collage');
    const center = document.querySelector('.intro-center');

    function mount() {
      const header = document.querySelector('.site-header');
      Core.ready(Collage.mount(container, items, {
        reveal: 'stagger',
        exclude: () => {
          const c = center.getBoundingClientRect();
          const rects = [new DOMRect(c.left - 16, c.top - 16, c.width + 32, c.height + 32)];
          if (header) rects.push(new DOMRect(0, 0, innerWidth, header.getBoundingClientRect().bottom));
          return rects;
        },
      }));
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount, { once: true });
    else mount();

    let t = null;
    addEventListener('resize', () => { clearTimeout(t); t = setTimeout(mount, 200); });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!--core:head-->
  <style>
    body {
      margin: 0;
      background: var(--color-paper);
      color: var(--color-ink);
      overflow: hidden;
      font-family: var(--font-display);
      font-weight: var(--fw-display);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout: header · gallery · counter + thumbnails ───────── */
    .v1-personal {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding-top: calc(var(--header-h) + var(--safe-top));
    }

    .v1-personal-scroll {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 var(--gutter);
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .v1-personal-scroll::-webkit-scrollbar { display: none; }
    html:not(.has-custom-cursor) .v1-personal-scroll { cursor: grab; }
    html:not(.has-custom-cursor) .v1-personal-scroll.is-dragging { cursor: grabbing; }

    /* Each photo keeps its ratio (--ar) and is never wider than the screen */
    .v1-personal-item {
      flex: 0 0 auto;
      height: min(50vh, calc((100vw - 48px) / var(--ar, 1.5)));
      aspect-ratio: var(--ar, 1.5);
      background: var(--color-placeholder);
      opacity: 0;
      transform: translateY(24px);
      transition: opacity var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out);
    }
    .v1-personal-item.revealed { opacity: 1; transform: none; background: transparent; }
    .v1-personal-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .v1-personal-bottom {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 12px var(--gutter) max(12px, var(--safe-bottom));
    }
    .v1-personal-bottom .gallery-counter { margin: 0; }

    /* Thumbnails: 3:2 buttons aligned with the gallery padding */
    .v1-personal-thumbs {
      display: flex;
      gap: 6px;
      max-width: 100%;
      padding-bottom: 6px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    .v1-personal-thumbs::-webkit-scrollbar { display: none; }
    .v1-personal-thumb {
      position: relative;
      flex: 0 0 auto;
      width: 72px;
      height: 48px;
      padding: 0;
      border: 0;
      background: var(--color-placeholder);
      opacity: var(--dim);
      cursor: pointer;
      transition: opacity var(--dur-1) var(--ease-out);
    }
    .v1-personal-thumb::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -5px;
      height: 2px;
      background: var(--color-red);
      transform: scaleX(0);
      transition: transform var(--dur-2) var(--ease-out);
    }
    .v1-personal-thumb[aria-current="true"] { opacity: 1; }
    .v1-personal-thumb[aria-current="true"]::after { transform: none; }
    .v1-personal-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @media (hover: hover) {
      .v1-personal-thumb:hover { opacity: 1; }
    }

    /* ── Phones (portrait): snap one photo at a time, counter replaces thumbnails ── */
    @media (max-width: 767px) {
      .v1-personal-scroll { scroll-snap-type: x mandatory; padding: 0 16px; gap: 12px; }
      .v1-personal-item {
        height: auto;
        width: calc(100vw - 32px);
        max-height: 72svh;
        scroll-snap-align: center;
        scroll-snap-stop: always;
      }
      .v1-personal-thumbs { display: none; }
    }
    /* ── Phones (landscape): photo fills the height, no thumbnails ── */
    @media (orientation: landscape) and (max-height: 500px) {
      .v1-personal-item { height: calc(100dvh - var(--header-h) - 48px); width: auto; max-height: none; }
      .v1-personal-thumbs { display: none; }
      .v1-personal-bottom { padding-top: 4px; }
    }
  </style>
</head>
<body>
  <main id="main" class="v1-personal">
    <h1 class="visually-hidden" id="v1-title">Personal</h1>
    <div class="v1-personal-scroll" id="v1-personal-scroll" data-cursor="Drag"
         role="region" aria-roledescription="gallery" aria-labelledby="v1-title" tabindex="0"></div>
    <div class="v1-personal-bottom">
      <p class="gallery-counter" id="v1-counter" aria-live="polite"></p>
      <div class="v1-personal-thumbs" id="v1-personal-thumbs" role="group" aria-label="Photos"></div>
    </div>
  </main>

  <script src="/config.js"></script>
  <script>
  (() => {
    'use strict';
    const scrollEl  = document.getElementById('v1-personal-scroll');
    const thumbsNav = document.getElementById('v1-personal-thumbs');
    const counterEl = document.getElementById('v1-counter');
    const items     = CONFIG.pageGalleries?.['personal-v2'] || [];
    const total     = items.length;
    const thumbs    = [];

    const page = (CONFIG.allPages || []).find(p => p.id === 'archive-personal-v1');
    if (page && page.title) document.getElementById('v1-title').textContent = page.title;

    items.forEach((proj, idx) => {
      const ar = Core.ratio(proj) || 1.5;
      const div = document.createElement('div');
      div.className = 'v1-personal-item';
      div.style.setProperty('--ar', ar);
      div.innerHTML = `<img ${Core.imgAttrs(proj, { w: 1080, sizes: `(max-width: 767px) calc(100vw - 32px), ${Math.round(50 * ar)}vh`, high: idx === 0, eager: idx < 3, draggable: false })} />`;
      scrollEl.appendChild(div);

      // Thumbnails: tiny dedicated variant (never the gallery file), skipped on Save-Data
      const thumb = document.createElement('button');
      thumb.type = 'button';
      thumb.className = 'v1-personal-thumb';
      thumb.setAttribute('aria-label', `Photo ${idx + 1} of ${total}${proj.alt ? ': ' + proj.alt : ''}`);
      if (!Core.saveData) thumb.innerHTML = `<img src="${Core.img(proj.url || proj.image, 128, 60)}" alt="" decoding="async" loading="lazy" />`;
      thumb.addEventListener('click', () => gallery.goTo(idx));
      thumbsNav.appendChild(thumb);
      thumbs.push(thumb);
    });

    // One engine for wheel, drag, thumbnails and arrow keys (Core.hscroll)
    const gallery = Core.hscroll(scrollEl, {
      items: [...scrollEl.children],
      onChange(i) {
        counterEl.textContent = Core.counter(i, total);
        thumbs.forEach((t, j) => t.setAttribute('aria-current', j === i ? 'true' : 'false'));
        const t = thumbs[i];
        if (t && thumbsNav.scrollWidth > thumbsNav.clientWidth) {
          thumbsNav.scrollLeft = t.offsetLeft - thumbsNav.clientWidth / 2 + t.offsetWidth / 2;
        }
      },
    });

    // Each photo rises in once decoded (no fixed timers)
    [...scrollEl.children].forEach((item, i) => {
      if (Core.reduceMotion.matches) { item.classList.add('revealed'); return; }
      Core.decoded(item.querySelector('img'), 1500)
        .then(() => setTimeout(() => item.classList.add('revealed'), Math.min(i, 6) * 40));
    });
    Core.ready(Core.decoded(scrollEl.querySelector('img')));
  })();
  </script>
</body>
</html>
